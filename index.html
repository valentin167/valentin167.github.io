<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · SICO</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">SICO</div>
      <h5>SICO</h5>
      <div class="auth-sub">Gestión de stock indumentaria</div>

      <form id="loginForm">
        <div class="input-field">
          <input id="email" type="email" required>
          <label for="email">Correo electrónico</label>
        </div>
        <div class="input-field">
          <input id="password" type="password" required>
          <label for="password">Contraseña</label>
        </div>
        <div id="loginError" style="color:#B3452C;font-size:0.85rem;margin-bottom:10px;display:none;"></div>
        <button type="submit" class="btn btn-gold waves-effect" style="width:100%;">
          Ingresar <i class="material-icons right">login</i>
        </button>
      </form>

      <div class="demo-creds">
        <strong>Usuario administrador de prueba</strong><br>
        Correo: admin@tienda.com<br>
        Contraseña: admin123
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    auth_redirectIfLoggedIn();

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const result = auth_login(email, password);
      const errBox = document.getElementById('loginError');
      if (result.ok) {
        window.location.href = 'sucursal.html';
      } else {
        errBox.textContent = result.error;
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
